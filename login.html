<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nails By Olivia</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Nails By Olivia</h1>

        <h2>Admin Login</h2>

        <input
            type="email"
            id="email"
            placeholder="E-mail">

        <input
            type="password"
            id="password"
            placeholder="Wachtwoord">

        <button id="loginBtn">
            Inloggen
        </button>

        <a href="index.html" class="back-button">
            Terug naar website
        </a>

    </div>

</div>

<script src="firebase.js"></script>
<script src="script.js"></script>

</body>

</html>
