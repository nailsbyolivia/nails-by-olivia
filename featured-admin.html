<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Designs Manager</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="login-container">

    <h1>Featured Designs Manager</h1>

    <p>
    Beheer hier de ontwerpen die op de homepage verschijnen.
</p>

<div id="addFeaturedForm">

    <input
        type="text"
        id="titel"
        placeholder="Titel van het ontwerp">

    <textarea
        id="beschrijving"
        rows="4"
        placeholder="Beschrijving">
    </textarea>

    <input
        type="file"
        id="foto"
        accept="image/*">

    <img
        id="preview"
        style="
            display:none;
            width:200px;
            margin-top:10px;
            border-radius:15px;
        ">

    <button id="saveBtn">
        Opslaan Featured Design
    </button>

</div>

<h2>Featured Designs</h2>

<div id="featuredList"></div>

    <a href="admin.html" class="back-button">
        Terug naar Admin
    </a>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script src="featured-admin.js
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="firebase.js"></script>

<script src="featured-admin.js"></script>

</body>
</html>

</body>
</html>
